[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghmd"
version = "0.5.4"
description = "GitHub-style GFM Markdown TUI browser for the terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "markdown-it-py>=4.1.0,<5",
  "linkify-it-py>=2.0.0,<3",
  "mdit-py-plugins>=0.6.0,<0.7",
  "textual>=1.0.0,<9",
  "rich>=13.7.0,<15",
  "Pygments>=2.17.0",
]

[project.optional-dependencies]
images = [
  "pillow>=10.0",
  "textual-image[textual]>=0.13.2,<0.14; python_version >= '3.12'",
]
math = [
  "matplotlib>=3.8,<4",
]
all = [
  "pillow>=10.0",
  "textual-image[textual]>=0.13.2,<0.14; python_version >= '3.12'",
  "matplotlib>=3.8,<4",
]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
ghmd = "ghmd.cli:main"

[tool.setuptools.packages.find]
include = ["ghmd*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
